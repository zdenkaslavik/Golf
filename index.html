<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Golf Flip Cards</title>
<style>
  body, html {
    height: 100%;
    margin: 0;
    /* Switched to a fun, rounded font style */
    font-family: 'Comic Sans MS', 'Chalkboard SE', '打字机', sans-serif;
    background: url('images/bridge.jpg') no-repeat center center fixed;
    background-size: cover;
    display: flex;
    flex-direction: column; /* Stacks the title vertically above the container */
    justify-content: center;
    align-items: center;
    padding: 20px;
    box-sizing: border-box;
  }

  /* Main Title Styling */
  .main-title {
    color: #ffffff;
    font-size: 2.5rem;
    text-align: center;
    margin-bottom: 30px;
    text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7); /* Ensures text is readable over any background image */
    max-width: 90%; /* Forces text wrapping on small screens instead of overflowing */
    word-wrap: break-word;
  }

  .container {
    display: grid;
    /* Force 2x2 layout on desktop screen sizes */
    grid-template-columns: repeat(2, 160px);
    gap: 40px 30px;
    justify-content: center;
    width: 100%;
  }

  .flip-box {
    width: 160px;
    height: 160px;
    perspective: 1000px;
    cursor: pointer;
    margin: 0 auto;
    position: relative;
  }

  .flip-box.flipped .flip-box-inner {
    transform: rotateY(180deg);
  }

  .flip-box-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.6s;
    transform-style: preserve-3d;
    border-radius: 50%;
  }

  .flip-box-front, .flip-box-back {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    display: flex;
    justify-content: center;
    align-items: center;
    color: #1a330e; /* Slightly dark green text to keep up the golf theme */
    font-weight: bold;
    font-size: 16px;
    padding: 20px;
    text-align: center;
    backface-visibility: hidden;
    box-sizing: border-box;
    overflow: hidden;
    /* Translucent glass properties */
    background-color: rgba(255, 255, 255, 0.4); 
    backdrop-filter: blur(4px); 
  }

  /* Separate background layer to easily control translucency/opacity */
  .flip-box-front::before, .flip-box-back::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    border-radius: 50%;
    background: url('images/golfball.jpg') center center no-repeat;
    background-size: cover;
    opacity: 0.1; 
    pointer-events: none;
    z-index: 0;
  }

  .flip-box-front > *, .flip-box-back > * {
    position: relative;
    z-index: 1;
  }

  .flip-box-back {
    transform: rotateY(180deg);
  }

  /* Responsive screen sizing - handles mobile phone layouts */
  @media (max-width: 768px) {
    .main-title {
      font-size: 1.8rem; /* Shrinks the text slightly on small screens */
      margin-bottom: 20px;
    }
    .container {
      /* Force 1x4 layout on any smaller screen size */
      grid-template-columns: repeat(1, 140px);
      gap: 20px;
    }
    .flip-box {
      width: 140px;
      height: 140px;
    }
    .flip-box-front, .flip-box-back {
      font-size: 13px;
      padding: 15px;
    }
  }
</style>
</head>
<body>

  <!-- New Centered, Responsive Title -->
  <h1 class="main-title">Golf Fun Facts!</h1>

  <div class="container">
    <div class="flip-box" onclick="this.classList.toggle('flipped')">
      <div class="flip-box-inner">
        <div class="flip-box-front"><span>Fun Fact #1</span></div>
        <div class="flip-box-back"><span>The dimples on a golf ball create lift and reduce drag.</span></div>
      </div>
    </div>
    <div class="flip-box" onclick="this.classList.toggle('flipped')">
      <div class="flip-box-inner">
        <div class="flip-box-front"><span>Fun Fact #2</span></div>
        <div class="flip-box-back"><span>Golf is one of the few sports played on natural terrain.</span></div>
      </div>
    </div>
    <div class="flip-box" onclick="this.classList.toggle('flipped')">
      <div class="flip-box-inner">
        <div class="flip-box-front"><span>Fun Fact #3</span></div>
        <div class="flip-box-back"><span>The longest recorded drive is over 450 yards.</span></div>
      </div>
    </div>
    <div class="flip-box" onclick="this.classList.toggle('flipped')">
      <div class="flip-box-inner">
        <div class="flip-box-front"><span>Fun Fact #4</span></div>
        <div class="flip-box-back"><span>Golf balls were originally made of hardwood.</span></div>
      </div>
    </div>
  </div>
</body>
</html>
